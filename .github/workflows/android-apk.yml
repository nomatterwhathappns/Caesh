name: Build Android APK

on:
  push:
    branches: [caesh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test data safety
        run: npm test

      - name: Export web app for Android
        run: npm run android:build

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Configure Android APK installer
        run: node scripts/configure-android-updater.mjs

      - name: Configure Android expense home-screen widget
        run: node scripts/configure-android-expense-widget.mjs

      - name: Configure Android app version
        run: node scripts/configure-android-version.mjs

      - name: Configure Android launcher icon
        run: node scripts/configure-android-icon.mjs

      - name: Check signing secrets
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; only the debug APK will be built."
          fi

      - name: Prepare permanent Android signing key
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caesh-release-key.jks"
          test -s "$RUNNER_TEMP/caesh-release-key.jks"

      - name: Configure release APK signing
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          CAESH_KEYSTORE_FILE: ${{ runner.temp }}/caesh-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build debug APK
        working-directory: android
        env:
          CAESH_KEYSTORE_FILE: ${{ runner.temp }}/caesh-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Name debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Caesh-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: caesh-android-debug-apk
          path: android/app/build/outputs/apk/debug/Caesh-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        working-directory: android
        env:
          CAESH_KEYSTORE_FILE: ${{ runner.temp }}/caesh-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Caesh.apk

      - name: Upload signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: caesh-android-signed-release-apk
          path: android/app/build/outputs/apk/release/Caesh.apk
          if-no-files-found: error
          retention-days: 14

      - name: Expose CAESH version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish direct APK download
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/caesh') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/caesh')) && steps.signing_check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="caesh-v${VERSION}"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --title "CAESH v${VERSION}" --prerelease --latest=false; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not create release $TAG after 5 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          ASSET_ID="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "Caesh.apk") | .id' || true)"
          if [ -n "$ASSET_ID" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" android/app/build/outputs/apk/release/Caesh.apk; then
              echo "Published Caesh.apk to $TAG."
              exit 0
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Generate SHA-256 update manifest
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/caesh') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/caesh')) && steps.signing_check.outputs.enabled == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";

          const packageInfo = JSON.parse(readFileSync("package.json", "utf8"));
          const sourceManifest = JSON.parse(readFileSync("public/update.json", "utf8"));
          const version = packageInfo.version;
          if (sourceManifest.version !== version) {
            throw new Error(`Update manifest version (${sourceManifest.version}) does not match package version (${version}).`);
          }

          const apkPath = "android/app/build/outputs/apk/release/Caesh.apk";
          const apk = readFileSync(apkPath);
          if (apk.length === 0) throw new Error("Signed release APK is empty.");
          const sha256 = createHash("sha256").update(apk).digest("hex");
          const expectedApkUrl = `https://github.com/nomatterwhathappns/Caesh/releases/download/caesh-v${version}/Caesh.apk`;
          if (sourceManifest.apkUrl !== expectedApkUrl) {
            throw new Error("Update manifest APK URL does not match the versioned release URL.");
          }

          const manifest = { ...sourceManifest, sha256 };
          mkdirSync("update-manifest", { recursive: true });
          writeFileSync("update-manifest/update.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(`Generated SHA-256 for CAESH v${version}: ${sha256}`);
          NODE

      - name: Publish verified update manifest
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/caesh') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/caesh')) && steps.signing_check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="caesh-update"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --title "CAESH Update Manifest" --prerelease --latest=false; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done
          ASSET_ID="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "update.json") | .id' || true)"
          if [ -n "$ASSET_ID" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" update-manifest/update.json; then
              echo "Published update.json to $TAG."
              exit 0
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

