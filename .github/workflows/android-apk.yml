name: Build Android APK

on:
  push:
    branches: [caesh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test data safety
        run: npm test

      - name: Export web app for Android
        run: npm run android:build

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Configure Android APK installer
        run: node scripts/configure-android-updater.mjs

      - name: Check signing secrets
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; only the debug APK will be built."
          fi

      - name: Prepare permanent Android signing key
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caesh-release-key.jks"
          test -s "$RUNNER_TEMP/caesh-release-key.jks"

      - name: Configure release APK signing
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          CAESH_KEYSTORE_FILE: ${{ runner.temp }}/caesh-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build debug APK
        working-directory: android
        env:
          CAESH_KEYSTORE_FILE: ${{ runner.temp }}/caesh-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Name debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Caesh-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: caesh-android-debug-apk
          path: android/app/build/outputs/apk/debug/Caesh-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Name signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Caesh.apk

      - name: Upload signed release APK
        if: steps.signing_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: caesh-android-signed-release-apk
          path: android/app/build/outputs/apk/release/Caesh.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/caesh' && steps.signing_check.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caesh-android-preview
          name: Caesh Android Preview
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/Caesh.apk
